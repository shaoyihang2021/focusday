name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # 打 tag 时构建并直接发布 Release
      - name: Build and publish release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FocusDay ${{ github.ref_name }}"
          releaseBody: |
            在下方 **Assets** 中下载 Windows 安装包：

            - `FocusDay_*_x64-setup.exe` — NSIS 安装包（推荐，免管理员权限）
            - `FocusDay_*_x64_en-US.msi` — MSI 安装包

            安装后即可使用番茄钟、待办清单、倒数日与桌面小组件。
          releaseDraft: false
          prerelease: false

      # 手动触发时只产出构建产物，方便测试
      - name: Build only
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: focusday-windows-installers
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

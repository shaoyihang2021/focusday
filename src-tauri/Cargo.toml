[package]
name = "focusday"
version = "0.17.10"
description = "FocusDay · 番茄工作法 + 待办清单 + 倒数日"
authors = ["shaoyihang2021"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop app is driven from the library target so the same code can power
# the mobile entry point later on.
name = "focusday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(desktop_os)"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Desktop-only capabilities: phone builds have no tray, autostart or shortcuts.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[profile.dev]
# Keeps Android debug APKs small enough to download and install.
strip = "symbols"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

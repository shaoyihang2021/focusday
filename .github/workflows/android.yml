name: Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages and NDK
        run: |
          # Hosted runners already ship the Android SDK; the setup-android
          # action is skipped because its `sdkmanager tools` step now fails.
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx tauri android init --ci

      # Debug builds are signed with the local debug key, so the APK installs
      # without shipping a release keystore in the repository. Only arm64 is
      # built: a universal APK with four ABIs would be hundreds of megabytes.
      - name: Build APK
        run: npx tauri android build --debug --apk --target aarch64 --ci

      - name: Collect APK
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="$(node -p "require('./package.json').version")"
          src=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$src" "FocusDay_${version}_android.apk"
          echo "APK=$PWD/FocusDay_${version}_android.apk" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusday-android
          path: FocusDay_*_android.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The Windows job creates the release; wait for it before uploading.
          for _ in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then break; fi
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
